    <!-- Items -->
    
        <text x="32" y="200" font-family="'Courier New', monospace" font-size="12" fill="#2d3748">2x Classic Mint Mojito</text>
        <text x="320" y="200" font-family="'Courier New', monospace" font-size="12" fill="#2d3748" text-anchor="end">₹900.00</text>
        
