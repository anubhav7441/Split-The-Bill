        <text x="320" y="296" font-family="'Courier New', monospace" font-size="12" fill="#2d3748" text-anchor="end">₹350.00</text>
        
    
    <!-- Totals -->
    
    <line x1="28" y1="330" x2="322" y2="330" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1.2"/>
    <text x="32" y="352" font-family="'Courier New', monospace" font-size="12" fill="#4a5568">Subtotal</text>
    <text x="320" y="352" font-family="'Courier New', monospace" font-size="12" fill="#4a5568" text-anchor="end">₹3,450.00</text>
    
        <text x="32" y="368" font-family="'Courier New', monospace" font-size="12" fill="#10b981">Discount</text>
        <text x="320" y="368" font-family="'Courier New', monospace" font-size="12" fill="#10b981" text-anchor="end">-₹200.00</text>
        
        <text x="32" y="388" font-family="'Courier New', monospace" font-size="12" fill="#4a5568">Tax / GST</text>
        <text x="320" y="388" font-family="'Courier New', monospace" font-size="12" fill="#4a5568" text-anchor="end">₹325.00</text>
        
        <text x="32" y="408" font-family="'Courier New', monospace" font-size="12" fill="#4a5568">Service Charge</text>
        <text x="320" y="408" font-family="'Courier New', monospace" font-size="12" fill="#4a5568" text-anchor="end">₹345.00</text>
        
    
    
    <line x1="28" y1="434" x2="322" y2="434" stroke="#1a202c" stroke-width="1.5"/>
    <text x="32" y="458" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#111827">TOTAL AMOUNT</text>
    <text x="320" y="458" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">₹3,920.00</text>
    <line x1="28" y1="468" x2="322" y2="468" stroke="#1a202c" stroke-width="1.5"/>
    
    
    <!-- Footer Note -->
    <text x="175" y="508" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">THANK YOU! VISIT AGAIN</text>
    <text x="175" y="524" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">*** Paid in Full · Card Auth: #94821 ***</text>
    
